<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairwayCount – Golf Schlag-Counter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f14; color: #e5e5ef; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a1a22; border: 1px solid #2a2a35; border-radius: 24px; padding: 48px 40px; max-width: 440px; width: 90%; text-align: center; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    .sub { color: #6b7280; font-size: 15px; margin-bottom: 32px; }
    .badge { display: inline-block; background: #1a3a2a; color: #4ade80; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 99px; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    a.btn { display: block; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; }
    .btn-primary { background: #22c55e; color: #0a1a0a; }
    .btn-secondary { background: transparent; border: 1px solid #2a2a35; color: #9ca3af; }
    footer { margin-top: 32px; color: #374151; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⛳</div>
    <h1>FairwayCount</h1>
    <p class="sub">Golf Schlag-Counter für Android</p>
    <div class="badge">Bald im Google Play Store</div>
    <div class="links">
      <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.TombSoft.fairwaycount">
        Google Play Store
      </a>
      <a class="btn btn-secondary" href="/fairwaycount/privacy-policy.html">
        Datenschutzerklärung
      </a>
    </div>
    <footer>© 2026 FairwayCount · nbergt</footer>
  </div>
</body>
</html>
